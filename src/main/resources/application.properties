spring.application.name=summit-migration-poc

# Oracle Free 23ai (see compose.yaml). FREEPDB1 is the default pluggable DB.
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/FREEPDB1
spring.datasource.username=summit
spring.datasource.password=summit
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# HikariCP pool under one service account (PLAN: not per-user sessions).
spring.datasource.hikari.maximum-pool-size=5

# Vaadin
vaadin.launch-browser=true
