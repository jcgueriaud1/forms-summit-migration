# Migration rule defaults — see docs/adr/0009-property-aware-migration-rules.md
# and the Prep-A1 amendment below for canvas + block sections.
# Classifier evaluation is top-down, first-match-wins; specific rules
# precede generic defaults. The item-side rules port ADR 0004's bucketing
# table, with property-aware refinement per ADR 0009 for Text Item (by
# DataType / MultiLine / ConcealData / Formula), Display Item (by
# Formula), and List Item (by ListStyle). Per-target attribute tables
# apply the Aura ignore list (ADR 0008) consistently across typography
# (FontSize/FontName/FontStyle/FontWeight/FontSpacing) and colour
# (BackColor/ForegroundColor). The canvas-side (`canvasClassifiers`)
# and block-side (`blockClassifiers`) sections drive Canvas → container
# and Block → Grid/FormLayout decisions for the scaffolder (ADR 0010).
# Out of scope (still deferred): Window / VisualAttribute / PropertyClass.

schemaVersion: 1

classifiers:
  # ---- Text Item — property-aware refinement (ADR 0009) -----------------
  # LovRole is a synthetic key injected by JsonRenderer.renderItemJson based on
  # the LOV's <LOVColumnMapping ReturnItem="…"> walk — the role can't be read
  # from the item's own XML because most LOV-bound items don't carry LovName
  # on themselves (the LOV side decides which item receives values). The rule
  # precedes DataType / ConcealData / MultiLine refinements so an LOV-bound
  # NUMBER column still becomes a ComboBox.
  - id: text-item-lov
    when: ItemType == "Text Item" and LovRole == "primary"
    target: ComboBox
    treatment: Automated
    aiHint: "Render as an empty ComboBox; populate items from the linked LOV's Record Group query."
  - id: item-summary
    when: SummaryFunction is not null
    target: TextField
    treatment: AI-coded
    aiHint: "Aggregate (per SummaryFunction: Sum/Count/Min/Max/Avg) in a pure, unit-testable aggregate method on the parent Domain object; bind the field read-only to its result."
  - id: text-item-calculated
    when: ItemType == "Text Item" and Formula is not null
    target: TextField
    treatment: AI-coded
    aiHint: "Compute the Formula in a pure, unit-testable Domain method and bind the field read-only to its result. Use a Binder converter only when the Formula is display-only formatting."
  - id: text-item-password
    when: ItemType == "Text Item" and ConcealData == "true"
    target: PasswordField
    treatment: Automated
  - id: text-item-multiline
    when: ItemType == "Text Item" and MultiLine == "true"
    target: TextArea
    treatment: Automated
  - id: text-item-number
    when: ItemType == "Text Item" and DataType in ["NUMBER", "INTEGER", "MONEY"]
    target: NumberField
    treatment: Automated
  - id: text-item-date
    when: ItemType == "Text Item" and DataType in ["DATE", "DATETIME"]
    target: DatePicker
    treatment: Automated
  - id: text-item-default
    when: ItemType == "Text Item"
    target: TextField
    treatment: Automated

  # ---- Display Item — Formula refinement (ADR 0004 row 9 generalised) ---
  - id: display-item-calculated
    when: ItemType == "Display Item" and Formula is not null
    target: TextField
    treatment: AI-coded
    aiHint: "Compute the Formula in a pure, unit-testable Domain method; render the field read-only bound to its result. Binder converter only for display-only formatting."
  - id: display-item-default
    when: ItemType == "Display Item"
    target: Span
    treatment: Automated

  # ---- List Item — ListStyle refinement (ADR 0004 row 3) ----------------
  - id: list-item-tlist
    when: ItemType == "List Item" and ListStyle == "Tlist"
    target: ListBox
    treatment: Automated
  - id: list-item-combobox
    when: ItemType == "List Item" and ListStyle == "Combobox"
    target: ComboBox
    treatment: Automated
  - id: list-item-default
    when: ItemType == "List Item"
    target: Select
    treatment: Automated

  # ---- Single-mapping ItemTypes (ADR 0004) ------------------------------
  - id: radio-group
    when: ItemType == "Radio Group"
    target: RadioButtonGroup
    treatment: Automated
  - id: check-box
    when: ItemType == "Check Box"
    target: Checkbox
    treatment: Automated
  - id: push-button
    when: ItemType == "Push Button"
    target: Button
    treatment: Automated
  - id: image-item-file-sourced
    when: ItemType == "Image" and imageSource == "file"
    target: Image
    treatment: Refactor
    aiHint: "Image is populated from the filesystem (READ_IMAGE_FILE) via a function-derived filename, not a DB BLOB — there is no bindable column. Rebuild as a service that resolves the filename (the image-lookup function) and serves the bytes as a StreamResource, converting any non-web-native image format to PNG/JPEG."
  - id: image-item
    when: ItemType == "Image"
    target: Image
    treatment: Automated
    aiHint: "DB-BLOB image item → bind the byte[] / BLOB column to a Vaadin Image via a StreamResource."
  - id: hierarchical-tree
    when: ItemType == "Hierarchical Tree"
    target: TreeGrid
    treatment: Automated

  # ---- Refactor-only ItemTypes (ADR 0004 — no clean Vaadin equivalent) --
  - id: chart-item
    when: ItemType == "Chart Item"
    target: Chart
    treatment: Refactor
    aiHint: "Vaadin Charts replaces the Chart Item. The dataset pipe is rebuilt from the backing RecordGroup or query — there is no 1:1 mapping."
  - id: bean-area
    when: ItemType == "Bean Area"
    target: CustomComponent
    treatment: Refactor
    aiHint: "Replace the embedded JavaBean with a Vaadin add-on or a custom Web Component. The bean's API has to be rebuilt against Vaadin Flow's Component model."
  - id: ole-container
    when: ItemType == "OLE Container"
    target: Unsupported
    treatment: Refactor
    aiHint: "OLE-embedded objects cannot be migrated. Identify what the embedded document provides and reimplement that capability natively."
  - id: activex-control
    when: ItemType == "ActiveX Control"
    target: Unsupported
    treatment: Refactor
    aiHint: "ActiveX has no web target. Replace with a native Vaadin component or a custom Web Component."
  - id: vbx-control
    when: ItemType == "VBX Control"
    target: Unsupported
    treatment: Refactor
    aiHint: "VBX has no web target. Replace with a native Vaadin component or a custom Web Component."
  - id: sound-item
    when: ItemType == "Sound"
    target: Unsupported
    treatment: Refactor
    aiHint: "Vaadin has no native audio component. Use the Element API to embed an HTMLAudioElement, or replace with a server-side notification."
  - id: user-area
    when: ItemType == "User Area"
    target: Unsupported
    treatment: Refactor
    aiHint: "User Area was a free-draw region with no modern equivalent. Identify the intent and replace with a layout, a custom Web Component, or a chart."

# ---- Per-target attribute tables --------------------------------------
# Every view-side target carries the Aura ignore list (ADR 0008): typography
# (FontSize/FontName/FontStyle/FontWeight/FontSpacing) and colour
# (BackColor/ForegroundColor/PromptForegroundColor) are owned by the Aura
# theme and dropped consistently across all view-side targets. Prompt
# typography variants (PromptFontSize/PromptFontName/PromptFontStyle/
# PromptFontWeight/PromptFontSpacing) follow the same rule. Geometry
# (XPosition/YPosition/Width/Height) and the container link
# (CanvasName/TabPageName/DirtyInfo) are layout concerns owned by the
# parent container rather than the item itself.
targets:

  Button:
    attributes:
      # Identification — not setters; the classifier picks the target.
      ItemType: { ignore: "Selector attribute used by classifier predicates" }
      LovRole: { ignore: "Selector attribute used by classifier predicates" }
      Name: { ignore: "Becomes the Vaadin component variable name in code, not a setter" }
      Label: { carry: setText }
      Tooltip: { carry: setTooltipText }
      Enabled: { carry: setEnabled }
      Visible: { carry: setVisible }
      Iconic: { compose: [Iconic, IconFilename], to: setIcon }
      AccessKey: { ignore: "Vaadin manages focus; button shortcuts are configured via Shortcuts" }
      PromptForegroundColor: { ignore: "Aura theme owns colour" }
      ImplementationClass:
        escalate: { treatment: Refactor, reason: "Custom JavaBean — redesign required" }
      # Aura theme owns typography
      FontSize: { ignore: "Aura theme owns typography" }
      FontName: { ignore: "Aura theme owns typography" }
      FontStyle: { ignore: "Aura theme owns typography" }
      FontWeight: { ignore: "Aura theme owns typography" }
      FontSpacing: { ignore: "Aura theme owns typography" }
      # Aura theme owns colour
      BackColor: { ignore: "Aura theme owns colour" }
      ForegroundColor: { ignore: "Aura theme owns colour" }
      # Layout owns geometry / container assignment
      XPosition: { ignore: "Vaadin Flow layout owns positioning" }
      YPosition: { ignore: "Vaadin Flow layout owns positioning" }
      Width: { ignore: "Vaadin Flow layout owns sizing" }
      Height: { ignore: "Vaadin Flow layout owns sizing" }
      CanvasName: { ignore: "Vaadin Flow layout replaces the Forms Canvas" }
      TabPageName: { ignore: "Vaadin Flow Tabs replace the Forms TabPage" }
      DirtyInfo: { ignore: "Forms-internal serialisation flag" }
      # Aura theme owns prompt layout / visual styling
      PromptDisplayStyle: { ignore: "Aura theme owns label placement" }
      PromptAttachmentOffset: { ignore: "Aura theme owns label placement" }
      PromptAttachmentEdge: { ignore: "Aura theme owns label placement" }
      PromptAlign: { ignore: "Aura theme owns label alignment" }
      PromptAlignOffset: { ignore: "Aura theme owns label alignment" }
      PromptJustification: { ignore: "Aura theme owns label alignment" }
      Justification: { ignore: "Aura theme owns text alignment" }
      Bevel: { ignore: "Aura theme owns borders / bevels" }
      FillPattern: { ignore: "Aura theme owns fills" }
      CompressionQuality: { ignore: "Aura theme owns rendering / compression" }
      ShowVerticalScrollbar: { ignore: "Vaadin component owns scrollbar visibility" }
      ShowHorizontalScrollbar: { ignore: "Vaadin component owns scrollbar visibility" }
      VisualAttributeName: { ignore: "Aura theme replaces Forms VisualAttribute" }
      TooltipVisualAttributeGroup: { ignore: "Aura theme replaces Forms VisualAttribute" }
      RecordVisualAttributeGroupName: { ignore: "Aura theme replaces Forms VisualAttribute" }
      DistanceBetweenRecords: { ignore: "Vaadin Grid row layout replaces multi-record canvas geometry" }
      # Forms-internal / navigation flags with no Vaadin component setter
      DatabaseItem: { ignore: "Database binding lives on the Binder, not the component" }
      MouseNavigate: { ignore: "Web focus model — pointer focus is handled by the browser" }
      KeyboardNavigable: { ignore: "Web focus model — tab order is managed by Vaadin / the DOM" }
      AutoSkip: { ignore: "Web focus model — auto-skip on max length is not a web idiom" }
      AutoHint: { ignore: "Vaadin uses helperText / Notification instead of Forms auto-hint" }
      NextNavigationItemName: { ignore: "Vaadin tab order replaces explicit next-item navigation" }
      PreviousNavigationItemName: { ignore: "Vaadin tab order replaces explicit previous-item navigation" }
      DataLengthSemantics: { ignore: "Java strings are length-counted in chars; semantics are uniform" }
      QueryLength: { ignore: "Web filtering has no separate query-mode length" }
      EditName: { ignore: "Vaadin TextArea replaces the Forms Editor object" }
      CopyValueFromItem: { ignore: "Use Binder bindings / value-change listeners to mirror values across fields" }
      SynchronizedItemName: { ignore: "Use Binder bindings / value-change listeners to mirror values across fields" }
      SummaryFunction: { ignore: "Vaadin Grid footer / aggregator replaces Forms summary items" }
      SummaryItemName: { ignore: "Vaadin Grid footer / aggregator replaces Forms summary items" }
      SummaryBlockName: { ignore: "Vaadin Grid footer / aggregator replaces Forms summary items" }
