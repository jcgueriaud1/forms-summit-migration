# Tier-1 reproducibility: a self-contained Oracle Free 23ai for the POC.
# Start with:  docker compose up -d
# The gvenzl image creates the APP_USER/APP_USER_PASSWORD schema on first boot
# and is ready when `docker compose ps` reports the service healthy.
services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: summit-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: summit_sys          # SYS / SYSTEM password
      APP_USER: summit                     # the non-privileged app schema the POC connects as
      APP_USER_PASSWORD: summit
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  oracle-data:
